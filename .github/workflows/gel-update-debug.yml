# Temporary: checks Gel's free-gel-files.ps1 on Windows. Only runs on the gel-update-fix branch.
name: Gel update debug
on:
  push:
    branches: [gel-update-fix]
jobs:
  script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the published Gel, hold its files, run the script
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/moongames0101-cmyk/jukebox-releases/releases/download/gel/Gel-Setup.exe -OutFile setup.exe
          $p = Start-Process .\setup.exe -ArgumentList '/S' -PassThru; [void]$p.WaitForExit(180000); "install: $($p.ExitCode)"
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\gel'
          "files: $((Get-ChildItem $dir -Recurse -File -Force).Count)"
          Set-Content -Path "$dir\resources\app.asar" -Value 'an old archive'
          $hold = "`$a = [IO.File]::Open('$dir\resources\app.asar', 'Open', 'Read', 'ReadWrite'); `$b = [IO.File]::Open('$dir\resources\app\main.js', 'Open', 'Read', 'ReadWrite'); Start-Sleep 300"
          $holder = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', $hold
          Start-Sleep 4
          "holder $($holder.Id) alive: $(-not $holder.HasExited)"
          foreach ($f in @("$dir\resources\app.asar", "$dir\resources\app\main.js", "$dir\Gel.exe")) {
            try { Rename-Item $f "$f.moved" -ErrorAction Stop; Rename-Item "$f.moved" $f; "rename ok: $f" } catch { "rename blocked: $f" }
          }
          # Start it the way the 32-bit installer does: from a 32-bit process, through Sysnative.
          $script = (Resolve-Path gel/build/free-gel-files.ps1).Path
          $inner = "& `"$env:WINDIR\Sysnative\WindowsPowerShell\v1.0\powershell.exe`" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$script`" -Path `"$dir`""
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -Command "`"arch in 32-bit parent: `$env:PROCESSOR_ARCHITECTURE`"; $inner" 2>&1 | ForEach-Object { "script: $_" }
          Get-Content (Join-Path $env:TEMP 'gel-update.log') -ErrorAction SilentlyContinue | ForEach-Object { "log: $_" }
          "holder alive after: $(-not $holder.HasExited)"
