# Builds Gel, the theme app for Spotify, Roblox and YouTube on Windows, and publishes it to the "gel" release.
#
# Gel checks that release a few seconds after it opens (and every few hours), downloads
# new versions in the background, and installs them when you restart it.
#
# - Every change to gel/ is built and published. The version is 1.3.<run number>, which is
#   newer than every copy out there (1.0.x from before, and 1.3.0 put in by hand).
# - Actions → "Gel (Windows app)" → Run workflow publishes the current code again.
# - The gel release is a pre-release that is never marked "latest", so jukebox updates
#   aren't affected, and this workflow never touches the jukebox or phone-app releases.
name: Gel (Windows app)

on:
  push:
    branches: [main]
    paths:
      - 'gel/**'
      - '.github/workflows/gel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gel-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: gel
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gel/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version=1.3.${{ github.run_number }}

      - name: Check the update files
        run: |
          test -f dist/Gel-Setup.exe
          grep -q "version: 1.3.${{ github.run_number }}" dist/latest.yml
          grep -q "Gel-Setup.exe" dist/latest.yml
          cat dist/latest.yml

      - name: Check an update gets past programs holding Gel's files
        shell: pwsh
        run: |
          # Install, then have another program hold Gel's files open (the way an Electron app
          # holds an app.asar it has looked at), then update. The update must close that program
          # and go through, instead of stopping with "Failed to uninstall old application files".
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path dist/Gel-Setup.exe).Path
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\gel'
          $first = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          "first install exit code: $($first.ExitCode)"
          if (-not (Test-Path "$dir\Gel.exe")) { throw "the first install didn't happen" }
          Set-Content -Path "$dir\resources\app.asar" -Value 'an old archive'
          $hold = "`$a = [IO.File]::Open('$dir\resources\app.asar', 'Open', 'Read', 'ReadWrite'); `$b = [IO.File]::Open('$dir\resources\app\main.js', 'Open', 'Read', 'ReadWrite'); Start-Sleep 300"
          $holder = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', $hold
          Start-Sleep 4
          if ($holder.HasExited) { throw "the test program didn't start holding the files" }
          $update = Start-Process $setup -ArgumentList '/S', '--updated' -Wait -PassThru
          "update exit code: $($update.ExitCode)"
          Get-Content (Join-Path $env:TEMP 'gel-update.log') -ErrorAction SilentlyContinue | ForEach-Object { "log: $_" }
          if ($update.ExitCode -ne 0) { throw "the update failed with code $($update.ExitCode)" }
          Start-Sleep 1
          if (-not $holder.HasExited) { Stop-Process -Id $holder.Id -Force; throw "the program holding Gel's files wasn't closed" }
          if (Test-Path "$dir\resources\app.asar") { throw "the old app.asar is still there" }
          if (-not (Test-Path "$dir\resources\app\main.js")) { throw "the new files are missing" }
          if (-not (Test-Path "$dir\Gel.exe")) { throw "Gel.exe is missing after the update" }
          "The update closed the program holding Gel's files and went through."

      - uses: actions/upload-artifact@v4
        with:
          name: Gel-Setup
          path: gel/dist/Gel-Setup.exe

      - name: Publish to the gel release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Gel (themes for Spotify, Roblox and YouTube on Windows)
          NOTES: |
            Gel themes Spotify, Roblox and YouTube on Windows.

            - Spotify: colours, fonts, animated backgrounds and layouts, applied with Spicetify.
            - Roblox: your own font, cursor, death sound and an animated avatar background.
            - YouTube: 19 animated themes, your own logo and a built-in ad blocker, through a small browser extension Gel makes for you (Opera, Chrome, Edge, Brave).

            Download Gel-Setup.exe once. After that Gel updates itself from this release.
            Windows may say "Windows protected your PC" because Gel isn't code-signed: choose More info, then Run anyway.
        run: |
          if ! gh release view gel >/dev/null 2>&1; then
            gh release create gel --title "$TITLE" --prerelease --latest=false --notes "$NOTES"
          else
            gh release edit gel --title "$TITLE" --notes "$NOTES"
          fi
          # The installer goes up first, then latest.yml, so Gel never sees a new version before its file is there.
          gh release upload gel dist/Gel-Setup.exe --clobber
          gh release upload gel dist/latest.yml --clobber
